<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCore Enterprise HIS - Hospital Management Dashboard</title>
  <meta name="description" content="Next-generation healthcare management and hospital operating system. Real-time patient monitoring, billing POS, pharmacy stock, and administrative analytics.">
  <meta name="keywords" content="Hospital Management System, EHR, Patient Dashboard, Medical POS, Pharmacy Inventory">
  <meta name="theme-color" content="#0d9488">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MediCore Enterprise HIS Dashboard">
  <meta property="og:description" content="Comprehensive real-time administrative and clinical dashboard for hospital management.">

  <!-- Performance Optimizations: CDN Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            medicore: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' }
          }
        }
      }
    }
  </script>
  
  <!-- Deferred External Scripts for Faster Page Load -->
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    .nav-btn.active { background-color: #0d9488 !important; color: #ffffff !important; font-weight: 700; }
    .nav-btn.active i { color: #ffffff !important; }
  </style>

  <!-- Structured Data JSON-LD for Search Engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "MediCore Enterprise HIS",
    "operatingSystem": "Web Browser",
    "applicationCategory": "HealthApplication",
    "description": "Hospital Information System with live patient EHR, Pharmacy, and POS Billing."
  }
  </script>
</head>
<body class="h-full font-sans text-slate-800 dark:text-slate-100 antialiased flex flex-col md:flex-row overflow-hidden bg-slate-100 dark:bg-slate-950 transition-colors duration-200">

  <!-- MAIN SIDEBAR MENU -->
  <aside class="w-full md:w-64 bg-slate-900 dark:bg-slate-900/95 text-slate-300 flex-shrink-0 flex flex-col justify-between border-r border-slate-800 z-20" aria-label="Sidebar Navigation">
    <div class="overflow-y-auto">
      <!-- Header / Logo -->
      <div class="h-16 flex items-center px-6 bg-slate-950/60 border-b border-slate-800 sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-medicore-600 text-white rounded-xl shadow-lg">
            <i data-lucide="cross" class="w-5 h-5 fill-white"></i>
          </div>
          <div>
            <span class="font-extrabold text-xl text-white tracking-wide">Medi<span class="text-medicore-500">Core</span></span>
            <span class="text-[9px] text-slate-400 block -mt-1 font-semibold uppercase tracking-wider">Enterprise HIS v5.2</span>
          </div>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="p-4 space-y-4">
        <!-- Core Clinical -->
        <div>
          <div class="px-3 pb-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Core Operations</div>
          <div class="space-y-1">
            <button onclick="router('overview')" id="nav-overview" class="nav-btn active w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Admin Command Center</div>
            </button>
            <button onclick="router('patients')" id="nav-patients" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="users" class="w-4 h-4"></i> Patient Directory (EHR)</div>
              <span id="badge-patients" class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-mono">0</span>
            </button>
            <button onclick="router('doctors')" id="nav-doctors" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="stethoscope" class="w-4 h-4"></i> Medical Staff & Roster</div>
              <span id="badge-doctors" class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-mono">0</span>
            </button>
            <button onclick="router('appointments')" id="nav-appointments" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="calendar" class="w-4 h-4"></i> OPD Queue</div>
            </button>
          </div>
        </div>

        <!-- Logistics & Finance -->
        <div>
          <div class="px-3 pb-1.5 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Finance & Supply Chain</div>
          <div class="space-y-1">
            <button onclick="router('billing')" id="nav-billing" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="receipt" class="w-4 h-4"></i> Billing & Counter POS</div>
            </button>
            <button onclick="router('pharmacy')" id="nav-pharmacy" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="pill" class="w-4 h-4"></i> Pharmacy Inventory</div>
            </button>
            <button onclick="router('beds')" id="nav-beds" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="bed-double" class="w-4 h-4"></i> ER Bed Management</div>
            </button>
            <button onclick="router('diagnostics')" id="nav-diagnostics" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <div class="flex items-center gap-2.5"><i data-lucide="microscope" class="w-4 h-4"></i> Lab & Diagnostics</div>
            </button>
          </div>
        </div>
      </nav>
    </div>

    <!-- System Status Footer -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/40">
      <div class="flex items-center justify-between text-xs">
        <span class="text-slate-400">System Mode</span>
        <span class="text-emerald-400 font-semibold flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Live Active</span>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- Top Header -->
    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 z-10 shadow-sm">
      <h1 id="page-title" class="text-lg font-bold text-slate-900 dark:text-white">Admin Command Center</h1>
      <div class="flex items-center gap-4">
        <button onclick="ThemeController.toggle()" title="Toggle Theme" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
          <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
        <div class="flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
          <div class="w-8 h-8 rounded-full bg-medicore-700 text-white font-bold flex items-center justify-center text-xs">AD</div>
          <div class="hidden sm:block text-left">
            <span class="text-xs font-bold block text-slate-800 dark:text-slate-200">System Admin</span>
            <span class="text-[10px] text-slate-400 block -mt-1">SuperUser Access</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Dynamic Viewport -->
    <main class="flex-1 overflow-y-auto p-6 space-y-6" id="app-viewport">
      <!-- Dynamic Views Rendered Here -->
    </main>
  </div>

  <!-- PATIENT ADMISSION MODAL -->
  <div id="modal-patient" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6">
      <h3 class="font-bold text-base text-slate-900 dark:text-white mb-4">Admit New Patient</h3>
      <form id="form-patient" onsubmit="PatientController.add(event)" class="space-y-3">
        <input type="text" id="p-name" required placeholder="Full Name" class="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="p-age" required placeholder="Age" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
          <select id="p-gender" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
            <option value="Male">Male</option><option value="Female">Female</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="p-dept" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
            <option value="Cardiology">Cardiology</option><option value="Neurology">Neurology</option><option value="Pediatrics">Pediatrics</option><option value="Orthopedics">Orthopedics</option>
          </select>
          <select id="p-status" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
            <option value="Stable">Stable</option><option value="Critical">Critical</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="UIController.closeModal('modal-patient')" class="px-3 py-1.5 text-xs font-bold text-slate-500">Cancel</button>
          <button type="submit" class="px-3 py-1.5 text-xs font-bold bg-medicore-600 text-white rounded">Admit Patient</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DOCTOR ADDITION MODAL -->
  <div id="modal-doctor" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6">
      <h3 class="font-bold text-base text-slate-900 dark:text-white mb-4">Add Doctor Profile</h3>
      <form id="form-doctor" onsubmit="DoctorController.add(event)" class="space-y-3">
        <input type="text" id="d-name" required placeholder="Dr. Full Name" class="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
        <input type="text" id="d-spec" required placeholder="Specialty (e.g. Cardiology)" class="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="d-room" required placeholder="OPD Room" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
          <select id="d-status" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
            <option value="On Duty">On Duty</option><option value="In Surgery">In Surgery</option><option value="Off Duty">Off Duty</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="UIController.closeModal('modal-doctor')" class="px-3 py-1.5 text-xs font-bold text-slate-500">Cancel</button>
          <button type="submit" class="px-3 py-1.5 text-xs font-bold bg-medicore-600 text-white rounded">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- NEW POS INVOICE MODAL -->
  <div id="modal-billing" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6">
      <h3 class="font-bold text-base text-slate-900 dark:text-white mb-4">Create New Billing Invoice</h3>
      <form id="form-billing" onsubmit="BillingController.add(event)" class="space-y-3">
        <input type="text" id="b-patient" required placeholder="Patient Name" class="w-full p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="b-amount" required placeholder="Base Fee ($)" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
          <select id="b-dept" class="p-2 text-xs border rounded dark:bg-slate-800 dark:border-slate-700 dark:text-white">
            <option value="OPD Consultation">OPD Consultation</option>
            <option value="Emergency Treatment">Emergency Treatment</option>
            <option value="Pharmacy Checkout">Pharmacy Checkout</option>
            <option value="Lab Test Fee">Lab Test Fee</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="UIController.closeModal('modal-billing')" class="px-3 py-1.5 text-xs font-bold text-slate-500">Cancel</button>
          <button type="submit" class="px-3 py-1.5 text-xs font-bold bg-medicore-600 text-white rounded">Generate Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
